name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Code Quality & Tests
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Create local.properties file
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.WEATHER_API_KEY }}" ]; then
            echo "WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}" >> local.properties
          fi
      
      - name: Run tests
        run: ./gradlew test --no-daemon
      
      - name: Run lint check
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true
      
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html
          retention-days: 7
          if-no-files-found: ignore

  # Job 2: Build APK
  build:
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Create local.properties file
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.WEATHER_API_KEY }}" ]; then
            echo "WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}" >> local.properties
          fi
      
      - name: Get APK version info
        id: apk_info
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle.kts || echo "1.0")
          VERSION_CODE=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle.kts || echo "1")
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION_NAME ($VERSION_CODE)"
      
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
      
      - name: Get APK size
        id: apk_size
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE_BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || echo "0")
            SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES/1024/1024}")
            echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
            echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
            echo "📱 APK Size: ${SIZE_MB} MB"
          else
            echo "size_bytes=0" >> $GITHUB_OUTPUT
            echo "size_mb=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate APK info
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          echo "## 📱 APK Build Info" >> apk_info.md
          echo "" >> apk_info.md
          echo "| Info | Value |" >> apk_info.md
          echo "|------|-------|" >> apk_info.md
          echo "| Version Name | ${{ steps.apk_info.outputs.version_name }} |" >> apk_info.md
          echo "| Version Code | ${{ steps.apk_info.outputs.version_code }} |" >> apk_info.md
          echo "| APK Size | ${{ steps.apk_size.outputs.size_mb }} MB |" >> apk_info.md
          echo "| Build Date | $BUILD_DATE |" >> apk_info.md
          echo "| Commit | ${{ github.sha }} |" >> apk_info.md
          echo "" >> apk_info.md
          echo "### 📥 Download" >> apk_info.md
          echo "" >> apk_info.md
          echo "APK file is available in the artifacts section below 👇" >> apk_info.md
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Upload APK info
        uses: actions/upload-artifact@v4
        with:
          name: apk-info
          path: apk_info.md
          retention-days: 30
      
      - name: Comment PR with APK info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const info = fs.readFileSync('apk_info.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: info + '\n\n✅ Build completed successfully!'
            });
      
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/logs/
            **/build/reports/
          retention-days: 7
          if-no-files-found: ignore
